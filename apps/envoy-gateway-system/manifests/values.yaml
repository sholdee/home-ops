podDisruptionBudget:
  minAvailable: 1
deployment:
  annotations:
    reloader.stakater.com/auto: "true"
  replicas: 3
  envoyGateway:
    resources:
      limits:
        cpu: 100m
        memory: 150Mi
      requests:
        cpu: 10m
        memory: 150Mi
  pod:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            control-plane: envoy-gateway
config:
  envoyGateway:
    provider:
      kubernetes:
        # The leader renews its Lease once per retry period (default 2s). Each
        # renewal is one etcd write. The lease duration (15s) and the renew
        # deadline (10s) stay.
        leaderElection:
          retryPeriod: 5s
