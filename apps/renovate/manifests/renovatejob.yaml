---
# yaml-language-server: $schema=https://kube-schemas.shold.io/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate
spec:
  discoveryFilters:
    [
      "/sholdee/(docker-compose|caddy-proxy-cloudflare|adguard-exporter|crd-schema-publisher|home-ops|drydock)/",
    ]
  extraEnv:
    - name: LOG_LEVEL
      value: info
    - name: RENOVATE_PLATFORM_COMMIT
      value: "true"
    - name: NODE_OPTIONS
      value: "--max-old-space-size=1536"
    - name: RENOVATE_REDIS_URL
      valueFrom:
        secretKeyRef:
          name: renovate-dragonfly-auth
          key: RENOVATE_REDIS_URL
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: renovate-secret
          key: RENOVATE_TOKEN
    - name: RENOVATE_REPOSITORY_CACHE
      value: enabled
    - name: RENOVATE_REPOSITORY_CACHE_TYPE
      value: "s3://renovate-cache"
    - name: RENOVATE_SECRETS
      value: '{"MISE_GITHUB_TOKEN":"$(GITHUB_TOKEN)"}'
    - name: RENOVATE_CUSTOM_ENV_VARIABLES
      value: '{"MISE_TRUSTED_CONFIG_PATHS":"/tmp/repos/github/sholdee","MISE_GITHUB_TOKEN":"{{ secrets.MISE_GITHUB_TOKEN }}"}'
    - name: RENOVATE_ALLOWED_UNSAFE_EXECUTIONS
      value: '["mise"]'
    - name: RENOVATE_ALLOWED_COMMANDS
      value: '["^go run \\./scripts/sync-argocd-gitops-engine\\.go$","^mise lock --yes$"]'
    - name: AWS_REGION
      value: garage
    - name: AWS_ENDPOINT_URL
      value: "http://10.2.0.110:3900"
    - name: S3_FORCE_PATH_STYLE
      value: "true"
  provider:
    name: github
  image: renovate/renovate:44.257.9@sha256:d6b65ff3562dd499240b23d34ef806ec7e5fd2675e4236a027dfb36774f2aa75
  # Keep Renovate pods off the control-plane nodes. Their disk writes at the start
  # of each hour slow etcd. Two pods at a time fit the memory of the two workers.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                renovate-operator.mogenius.com/renovatejob: renovate
  parallelism: 2
  schedule: "0 * * * *"
  secretRef: renovate-secret
  resources:
    requests:
      cpu: 500m
      memory: 2048Mi
    limits:
      cpu: "1"
      memory: 2048Mi
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-webhook-token
        key: token
