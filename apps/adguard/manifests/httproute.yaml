---
# yaml-language-server: $schema=https://kube-schemas.shold.io/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard
  namespace: adguard
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: gateway
  hostnames:
    - adguard.mgmt.sholdee.net
  rules:
    - backendRefs:
        - name: adguard-http
          port: 80
---
# yaml-language-server: $schema=https://kube-schemas.shold.io/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: adguard-lb-policy
  namespace: adguard
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: adguard
  # AdGuard Home login sessions are local to each replica, so pin each browser
  # to one pod with a gateway-issued cookie.
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Cookie
      cookie:
        name: route
        ttl: 24h
