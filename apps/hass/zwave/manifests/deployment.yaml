apiVersion: apps/v1
kind: Deployment
metadata:
  name: zwave
  namespace: hass
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zwave
  template:
    metadata:
      labels:
        app: zwave
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 20
        fsGroup: 65534
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zwave
          image: ghcr.io/zwave-js/zwave-js-ui:11.23.0@sha256:86f418050ce658cb6b9a5b17c33065b113376f9ccef98b36b3f2c42050b59672
          resources:
            requests:
              memory: 300Mi
              cpu: "10m"
            limits:
              memory: 300Mi
          livenessProbe: &probe
            httpGet:
              path: /health/zwave
              port: http
            initialDelaySeconds: 10
          readinessProbe: *probe
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: zwave
                  key: pass
            - name: ZWAVEJS_EXTERNAL_CONFIG
              value: /usr/src/app/store/.config-db
            - name: TRUST_PROXY
              value: "10.52.0.0/16"
            - name: TZ
              value: America/Chicago
          ports:
            - containerPort: 8091
              name: http
              protocol: TCP
            - containerPort: 3000
              name: websocket
              protocol: TCP
          volumeMounts:
            - name: zwave-data
              mountPath: /usr/src/app/store
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: zwave-data
          persistentVolumeClaim:
            claimName: zwave-pvc
