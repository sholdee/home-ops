---
# yaml-language-server: $schema=https://kube-schemas.shold.io/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
  labels:
    app: dragonfly
spec:
  replicas: 2
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.2@sha256:18afa43e911f1dff18c7d1eb452361876d9702bb1cdff5c5d75c69617a4065c9
  imagePullPolicy: IfNotPresent
  args:
    - --maxmemory=256mb
    - --cache_mode=true
  # Do NOT set spec.labels / spec.ownedObjectsMetadata with `app: dragonfly`:
  # dragonfly-operator v1.6+ manages the `app` label itself and rejects a CR that
  # sets an operator-managed label ("failed to generate dragonfly resources"). The
  # operator still applies `app: dragonfly` to the owned StatefulSet/pods/objects,
  # so label selectors (incl. the topology spread below) keep working.
  networkPolicyEnabled: false
  enableReplicationReadinessGate: true
  pdb:
    minAvailable: 1
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: dragonfly
