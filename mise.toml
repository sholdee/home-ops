[tools]
# Core validation and command UX.
just = "1.58.0"
lefthook = "2.1.10"
oxfmt = "0.64.0"
shellcheck = "0.11.0"
bats = "1.14.0"
rush = "0.9.0"
actionlint = "1.7.12"
kubeconform = "0.8.0"
jsonschema = "16.8.0"
zizmor = "1.29.0"
gitleaks = "8.30.1"

# Kubernetes and GitOps CLIs.
kubectl = "1.36.4"
argocd = "3.5.1"
"github:cloudnative-pg/cloudnative-pg[exe=kubectl-cnpg]" = "v1.30.0"
kustomize = "5.8.1"
helm = "3.21.4"
yq = "4.53.6"
jq = "1.8.2"
"aqua:sholdee/crd-schema-publisher" = "2026.815.170632"
"github:sholdee/drydock[exe=drydock]" = "v0.2.9"

# Bootstrap, node lifecycle, and operator workflow CLIs.
python = "3.14.7"
pipx = "1.16.7"
ansible-core = "2.21.3"
"pipx:ansible-lint" = "26.8.0"
kind = "0.32.0"
lima = "2.2.0"
op = "2.34.0"
gh = "2.98.0"

[tool_alias]
# The registry default for op is the vfox-1password plugin, whose plugin-clone
# step is not concurrency-safe: parallel `mise exec` lefthook tasks race the
# clone and fail with "module 'metadata' not found". The aqua backend has no
# plugin step and installs safely in parallel.
op = "aqua:1password/cli"
