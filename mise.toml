[tools]
# Core validation and command UX.
just = "1.59.0"
lefthook = "2.2.2"
oxfmt = "0.74.0"
shellcheck = "0.11.0"
bats = "1.14.0"
rush = "0.11.0"
actionlint = "1.7.12"
kubeconform = "0.8.0"
jsonschema = "17.2.1"
zizmor = "1.31.1"
gitleaks = "8.30.1"

# Kubernetes and GitOps CLIs.
kubectl = "1.37.1"
argocd = "3.5.6"
"github:cloudnative-pg/cloudnative-pg" = "v1.30.1"
kustomize = "5.8.3"
helm = "3.22.1"
yq = "4.54.1"
jq = "1.8.2"
"aqua:sholdee/crd-schema-publisher" = "2026.1023.52824"
"github:sholdee/drydock" = "v0.3.7"

# Bootstrap, node lifecycle, and operator workflow CLIs.
# ansible-core 2.21 supports Python up to 3.14; its dataclasses patch crashes on 3.15.
python = "3.14.9"
pipx = "1.18.4"
ansible-core = "2.21.5"
"pipx:ansible-lint" = "26.9.0"
kind = "0.33.0"
lima = "2.2.1"
op = "2.34.0"
gh = "2.103.1"

[tool_alias]
# The registry default for op is the vfox-1password plugin, whose plugin-clone
# step is not concurrency-safe: parallel `mise exec` lefthook tasks race the
# clone and fail with "module 'metadata' not found". The aqua backend has no
# plugin step and installs safely in parallel.
op = "aqua:1password/cli"
